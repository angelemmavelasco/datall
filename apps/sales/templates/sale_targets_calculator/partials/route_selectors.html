{% if mode == 'adjustment' %}
<!-- Ajuste a Ruta Única -->
<div class="flex flex-col gap-1 col-span-1 md:col-span-2">
    <label class="text-strong text-sm">Ruta a ajustar</label>
    <select name="origin_route" class="border border-border rounded p-1 bg-page text-sm text-strong w-full outline-none" hx-get="{% url 'sales:sale_targets_calculator' %}?action=load_customers" hx-target="#customer-selector-container">
        <option value="">Selecciona una ruta...</option>
        {% for r in routes %}
        <option value="{{ r.id }}">{{ r.id|upper }} {{ r.name|title }}</option>
        {% endfor %}
    </select>
</div>
{% else %}
<!-- Transferencia entre Rutas -->
<div class="flex flex-col gap-1">
    <label class="text-strong text-sm">Ruta Origen (Donde están los clientes)</label>
    <select name="origin_route" class="border border-border rounded p-1 bg-page text-sm text-strong w-full outline-none" hx-get="{% url 'sales:sale_targets_calculator' %}?action=load_customers" hx-target="#customer-selector-container">
        <option value="">Selecciona una ruta origen...</option>
        {% for r in routes %}
        <option value="{{ r.id }}">{{ r.id|upper }} {{ r.name|title }}</option>
        {% endfor %}
    </select>
</div>

<div class="flex flex-col gap-1">
    <label class="text-strong text-sm">Ruta Destino (Hacia donde van)</label>
    <select name="destination_route" class="border border-border rounded p-1 bg-page text-sm text-strong w-full outline-none">
        <option value="">Selecciona una ruta destino...</option>
        {% for r in routes %}
        <option value="{{ r.id }}">{{ r.id|upper }} {{ r.name|title }}</option>
        {% endfor %}
    </select>
</div>
{% endif %}
