{% if mode == 'adjustment' %}
<div class="flex flex-col gap-1 col-span-1">
    <label class="text-strong ">Ruta a ajustar</label>
    <select name="origin_route" class="border border-border rounded p-1 bg-page  text-strong w-full outline-none" hx-get="{% url 'sales:sale_targets_calculator' %}?action=load_customers" hx-target="#customer-selector-container">
        <option value="">Selecciona una ruta...</option>
        {% for r in routes %}
        <option value="{{ r.id }}">{{ r.id|upper }} {{ r.name|title }}</option>
        {% endfor %}
    </select>
</div>

<div class="flex flex-col gap-1 col-span-1">
    <label class="text-strong ">Operación a realizar</label>
    <select name="adjustment_direction" class="border border-border rounded p-1 bg-page  text-strong w-full outline-none">
        <option value="remove">Restar objetivos (Quitar clientes)</option>
        <option value="add">Sumar objetivos (Agregar clientes nuevos)</option>
    </select>
</div>
{% else %}
<div class="flex flex-col gap-1">
    <label class="text-strong">Ruta Origen (Donde están los clientes)</label>
    <select name="origin_route" class="border border-border rounded p-1 bg-page  text-strong w-full outline-none" hx-get="{% url 'sales:sale_targets_calculator' %}?action=load_customers" hx-target="#customer-selector-container">
        <option value="">Selecciona una ruta origen...</option>
        {% for r in routes %}
        <option value="{{ r.id }}">{{ r.id|upper }} {{ r.name|title }}</option>
        {% endfor %}
    </select>
</div>

<div class="flex flex-col gap-1">
    <label class="text-strong">Ruta Destino (Hacia donde van)</label>
    <select name="destination_route" class="border border-border rounded p-1 bg-page  text-strong w-full outline-none">
        <option value="">Selecciona una ruta destino...</option>
        {% for r in routes %}
        <option value="{{ r.id }}">{{ r.id|upper }} {{ r.name|title }}</option>
        {% endfor %}
    </select>
</div>

<div class="flex flex-col gap-1 col-span-1 md:col-span-2 mt-2">
    <label class="text-strong">Regla de crecimiento para ruta destino</label>
    <select name="transfer_growth_rule" class="border border-border rounded p-1 bg-page text-strong w-full outline-none">
        <option value="exact">Mantener crecimiento de ruta origen (Transferencia exacta)</option>
        <option value="dynamic">Adaptar a curva de crecimiento destino (Transferencia dinámica)</option>
    </select>
    <span class="text-xs text-muted">Aplica a partir del mes posterior a la fecha de aplicación</span>
</div>
{% endif %}
