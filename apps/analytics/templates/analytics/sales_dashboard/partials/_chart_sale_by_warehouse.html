<div class="border border-border rounded bg-container h-full flex flex-col overflow-hidden min-h-98">
    <div class="overflow-y-auto overflow-x-hidden flex-1 h-80" style="max-height: 380px; overflow-y: auto;">
        <div id="businessUnitBarChart" class="w-full" style="min-height: 380px;"></div>
    </div>
</div>

<script>
    (function() {
        function initBusinessUnitChart() {
            const chartDom = document.getElementById('businessUnitBarChart');
            if (!chartDom) return;

            if (echarts.getInstanceByDom(chartDom)) {
                echarts.dispose(chartDom);
            }

            const rawData = {{ chart_data.business_unit_chart_data|safe|default:'{}' }};
            const businessUnitData = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;

            const categories = businessUnitData.categories || [];
            const itemCount = categories.length;
            const minHeightPerItem = 42;
            const dynamicHeight = Math.max(380, itemCount * minHeightPerItem + 70);
            chartDom.style.height = dynamicHeight + 'px';

            const titleColor = getComputedStyle(document.documentElement).getPropertyValue('--color-title').trim() || '#9ca3af';
            const isMobile = window.innerWidth < 768;
            const greenColor = '#43B54B';
            const blueColor = '#435AB5';

            const businessUnitBarChart = echarts.init(chartDom);

            const businessUnitBarOption = {
                color: [greenColor, blueColor],
                title: {
                    text: 'Venta neta por gerencia',
                    textStyle: {
                        fontWeight: 'normal',
                        fontSize: 14,
                        color: titleColor
                    },
                    top: 8,
                },
                toolbox: {
                    feature: {
                        saveAsImage: {}
                    }
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    },
                    formatter: function(params) {
                        if (!params || params.length === 0) return '';
                        const dataIndex = params[0].dataIndex;
                        const buName = params[0].axisValue || '';

                        let res = `<span style="font-weight:600;">${buName}</span><br/>`;
                        params.forEach(p => {
                            const val = '$ ' + Number(p.value || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                            res += `${p.marker} ${p.seriesName}: <b>${val}</b><br/>`;
                        });

                        if (businessUnitData.target_achievement && businessUnitData.target_achievement[dataIndex] !== undefined) {
                            const ach = businessUnitData.target_achievement[dataIndex];
                            const target = (businessUnitData.targets && businessUnitData.targets[dataIndex]) || 0;
                            if (target > 0) {
                                res += `<span style="display:inline-block;margin-right:4px;border-radius:10px;width:10px;height:10px;background-color:#8b5cf6;"></span> Alcance: <b>${ach}%</b>`;
                            }
                        }

                        return res;
                    }
                },
                legend: {
                    data: ['Venta', 'Objetivo'],
                    bottom: 4,
                    left: 'center',
                    textStyle: {
                        color: titleColor
                    }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    top: 40,
                    bottom: 36,
                    containLabel: true,
                },
                xAxis: {
                    type: 'value',
                    boundaryGap: [0, 0.01],
                    splitLine: {
                        lineStyle: {
                            opacity: 0.10,
                        },
                        show: true
                    },
                    axisLabel: {
                        show: false
                    },
                    axisTick: {
                        show: false
                    },
                    axisLine: {
                        show: false
                    }
                },
                yAxis: {
                    type: 'category',
                    data: categories,
                    axisLabel: {
                        interval: 0,
                        color: titleColor,
                        formatter: function(val, index) {
                            const sale = (businessUnitData.sales && businessUnitData.sales[index] !== undefined)
                                ? '$ ' + Number(businessUnitData.sales[index]).toLocaleString('es-MX', { maximumFractionDigits: 0 })
                                : '';
                            return `${val}\n{sale|${sale}}`;
                        },
                        rich: {
                            sale: {
                                color: greenColor,
                                fontSize: 10,
                                lineHeight: 14,
                                fontWeight: '500'
                            }
                        }
                    }
                },
                series: [
                    {
                        name: 'Venta',
                        type: 'bar',
                        data: businessUnitData.sales || [],
                        barMaxWidth: 20,
                    },
                    {
                        name: 'Objetivo',
                        type: 'bar',
                        data: businessUnitData.targets || [],
                        barMaxWidth: 20,
                    }
                ]
            };

            businessUnitBarChart.setOption(businessUnitBarOption);
            window.addEventListener('resize', () => businessUnitBarChart.resize());
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initBusinessUnitChart);
        } else {
            initBusinessUnitChart();
        }
    })();
</script>
