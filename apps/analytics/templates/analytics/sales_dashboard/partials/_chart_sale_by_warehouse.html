<div id="warehouseBarChart" class="w-full h-[380px] min-h-full border border-border rounded bg-container"></div>

<script>
    (function() {
        function initWarehouseChart() {
            const chartDom = document.getElementById('warehouseBarChart');
            if (!chartDom) return;

            if (echarts.getInstanceByDom(chartDom)) {
                echarts.dispose(chartDom);
            }

            const rawData = {{ chart_data.warehouse_chart_data|safe|default:'{}' }};
            const warehouseData = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;

            const titleColor = getComputedStyle(document.documentElement).getPropertyValue('--color-title').trim() || '#9ca3af';
            const isMobile = window.innerWidth < 768;
            const greenColor = '#43B54B';
            const blueColor = '#435AB5';

            const warehouseBarChart = echarts.init(chartDom);

            const warehouseBarOption = {
                color: [greenColor, blueColor],
                title: {
                    text: 'Venta neta por centro de distribución',
                    textStyle: {
                        fontWeight: 'normal',
                        fontSize: 14,
                        color: titleColor
                    },
                    top: 8,
                },
                toolbox: {
                    feature: {
                        saveAsImage: {}
                    }
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    },
                    formatter: function(params) {
                        if (!params || params.length === 0) return '';
                        const dataIndex = params[0].dataIndex;
                        const whName = params[0].axisValue || '';

                        let res = `<span style="font-weight:600;">${whName}</span><br/>`;
                        params.forEach(p => {
                            const val = '$ ' + Number(p.value || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                            res += `${p.marker} ${p.seriesName}: <b>${val}</b><br/>`;
                        });

                        if (warehouseData.target_achievement && warehouseData.target_achievement[dataIndex] !== undefined) {
                            const ach = warehouseData.target_achievement[dataIndex];
                            const target = (warehouseData.targets && warehouseData.targets[dataIndex]) || 0;
                            if (target > 0) {
                                res += `<span style="display:inline-block;margin-right:4px;border-radius:10px;width:10px;height:10px;background-color:#8b5cf6;"></span> Alcance: <b>${ach}%</b>`;
                            }
                        }

                        return res;
                    }
                },
                legend: {
                    data: ['Venta', 'Objetivo'],
                    bottom: 0,
                    left: 'center',
                    textStyle: {
                        color: titleColor
                    }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '12%',
                    containLabel: true,
                },
                xAxis: {
                    type: 'value',
                    boundaryGap: [0, 0.01],
                    splitLine: {
                        lineStyle: {
                            opacity: 0.10,
                        },
                        show: true
                    },
                    axisLabel: {
                        show: false
                    },
                    axisTick: {
                        show: false
                    },
                    axisLine: {
                        show: false
                    }
                },
                yAxis: {
                    type: 'category',
                    data: warehouseData.categories || [],
                    axisLabel: {
                        color: titleColor,
                        formatter: function(val, index) {
                            const sale = (warehouseData.sales && warehouseData.sales[index] !== undefined)
                                ? '$ ' + Number(warehouseData.sales[index]).toLocaleString('es-MX', { maximumFractionDigits: 0 })
                                : '';
                            return `${val}\n{sale|${sale}}`;
                        },
                        rich: {
                            sale: {
                                color: greenColor,
                                fontSize: 10,
                                lineHeight: 14,
                                fontWeight: '500'
                            }
                        }
                    }
                },
                series: [
                    {
                        name: 'Venta',
                        type: 'bar',
                        data: warehouseData.sales || [],
                        barMaxWidth: 20,
                    },
                    {
                        name: 'Objetivo',
                        type: 'bar',
                        data: warehouseData.targets || [],
                        barMaxWidth: 20,
                    }
                ]
            };

            warehouseBarChart.setOption(warehouseBarOption);
            window.addEventListener('resize', () => warehouseBarChart.resize());
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initWarehouseChart);
        } else {
            initWarehouseChart();
        }
    })();
</script>
