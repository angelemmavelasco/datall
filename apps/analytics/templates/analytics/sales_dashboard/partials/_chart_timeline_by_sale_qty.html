<div id="timelineChart" style="width: 100%; height: 380px; min-height: 380px;"></div>

<script>
    (function() {
        function initTimelineChart() {
            const chartDom = document.getElementById('timelineChart');
            if (!chartDom) return;

            // Dispose previous instance if reloaded via HTMX or navigation
            if (echarts.getInstanceByDom(chartDom)) {
                echarts.dispose(chartDom);
            }

            const rawData = {{ chart_data.timeline_data|safe|default:'{}' }};
            const timelineData = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;

            const titleColor = getComputedStyle(document.documentElement).getPropertyValue('--color-title').trim() || '#9ca3af';
            const isMobile = window.innerWidth < 768;
            const greenColor = '#43B54B';
            const blueColor = '#435AB5';
            const containerBg = (chartDom.parentElement && getComputedStyle(chartDom.parentElement).backgroundColor)
                || getComputedStyle(document.documentElement).getPropertyValue('--color-container').trim()
                || '#ffffff';

            function getSalesData(isMob = false) {
                const sales = timelineData.sales || [];
                const len = sales.length;
                return sales.map((val, idx) => {
                    const item = {
                        value: val,
                        label: {
                            show: Number(val) > 0
                        }
                    };

                    if (len > 1) {
                        if (idx === 0) {
                            item.label.offset = [isMob ? 22 : 16, 0];
                        } else if (idx === len - 1) {
                            item.label.offset = [isMob ? -22 : -16, 0];
                        }
                    }

                    return item;
                });
            }

            function getLabelConfig(isMob) {
                return {
                    show: true,
                    position: 'top',
                    distance: isMob ? 5 : 6,
                    color: greenColor,
                    fontSize: isMob ? 8.5 : 9.5,
                    fontWeight: '700',
                    backgroundColor: containerBg,
                    borderColor: titleColor,
                    borderWidth: 1,
                    borderRadius: 3,
                    padding: isMob ? [1.5, 4] : [2, 5],
                    formatter: function(params) {
                        return formatNumberShort(params.value, true);
                    }
                };
            }

            function formatNumberShort(val, isCurrency = false) {
                if (val === null || val === undefined || isNaN(val) || Number(val) <= 0) return '';
                const num = Number(val);
                const abs = Math.abs(num);
                const prefix = isCurrency ? '$ ' : '';

                let text = '';
                if (abs >= 1000000) {
                    const m = abs / 1000000;
                    text = parseFloat(m.toFixed(1)) + ' M';
                } else if (abs >= 1000) {
                    const k = abs / 1000;
                    if (k >= 999.95) {
                        text = '1 M';
                    } else {
                        text = parseFloat(k.toFixed(1)) + ' k';
                    }
                } else {
                    text = abs.toLocaleString('es-MX');
                }

                return `${prefix}${text}`;
            }

            const timelineChart = echarts.init(chartDom);

            const timelineOptions = {
                color: [greenColor, blueColor],
                title: {
                    text: 'Evolución de venta neta y unidades',
                    textStyle: {
                        fontWeight: 'normal',
                        fontSize: 14,
                        color: titleColor
                    },
                    top: 8,
                },
                tooltip: {
                    trigger: 'axis',
                    formatter: function(params) {
                        if (!params || params.length === 0) return '';
                        const dataIndex = params[0].dataIndex;
                        const dateStr = params[0].axisValue || '';

                        let res = `<span style="font-weight:600;">${dateStr}</span><br/>`;
                        params.forEach(p => {
                            const val = p.seriesName === 'Venta neta'
                                ? '$ ' + Number(p.value || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                                : Number(p.value || 0).toLocaleString('es-MX');
                            res += `${p.marker} ${p.seriesName}: <b>${val}</b><br/>`;
                        });

                        if (timelineData.target_achievement && timelineData.target_achievement[dataIndex] !== undefined) {
                            const ach = timelineData.target_achievement[dataIndex];
                            res += `<span style="display:inline-block;margin-right:4px;border-radius:10px;width:10px;height:10px;background-color:#8b5cf6;"></span> Alcance acum.: <b>${ach}%</b>`;
                        }

                        return res;
                    }
                },
                legend: {
                    data: ['Venta neta', 'Unidades'],
                    bottom: 0,
                    left: 'center',
                    textStyle: {
                        color: titleColor
                    }
                },
                grid: {
                    left: isMobile ? '6%' : '3%',
                    right: isMobile ? '6%' : '3%',
                    top: isMobile ? 48 : 42,
                    bottom: isMobile ? '16%' : '12%',
                    containLabel: true,
                },
                toolbox: {
                    feature: {
                        saveAsImage: {}
                    }
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: timelineData.categories || [],
                    splitLine: {
                        show: false
                    },
                    axisLabel: {
                        show: true,
                        color: titleColor,
                        rotate: isMobile ? 45 : 0,
                        fontSize: isMobile ? 10 : 11
                    },
                    axisTick: {
                        show: true
                    },
                    axisLine: {
                        show: true
                    }
                },
                yAxis: [
                    {
                        type: 'value',
                        boundaryGap: [0, '18%'],
                        splitLine: {
                            lineStyle: {
                                opacity: 0.10,
                            },
                            show: true
                        },
                        axisLabel: {
                            show: false
                        },
                        axisTick: {
                            show: false
                        },
                        axisLine: {
                            show: false
                        },
                        show: true
                    },
                    {
                        type: 'value',
                        boundaryGap: [0, '18%'],
                        splitLine: {
                            lineStyle: {
                                opacity: 0.1,
                            },
                            show: false
                        },
                        axisLabel: {
                            show: false
                        },
                        axisTick: {
                            show: false
                        },
                        axisLine: {
                            show: false
                        },
                        show: true
                    }
                ],
                series: [
                    {
                        name: 'Venta neta',
                        type: 'line',
                        clip: false,
                        data: getSalesData(isMobile),
                        smooth: false,
                        yAxisIndex: 0,
                        label: getLabelConfig(isMobile),
                        labelLayout: {
                            hideOverlap: true
                        }
                    },
                    {
                        name: 'Unidades',
                        type: 'line',
                        clip: false,
                        data: timelineData.units || [],
                        smooth: false,
                        yAxisIndex: 1
                    }
                ]
            };

            timelineChart.setOption(timelineOptions);
            window.addEventListener('resize', () => {
                const currentIsMobile = window.innerWidth < 768;
                timelineChart.setOption({
                    grid: {
                        left: currentIsMobile ? '6%' : '3%',
                        right: currentIsMobile ? '6%' : '3%',
                        top: currentIsMobile ? 48 : 42,
                        bottom: currentIsMobile ? '16%' : '12%',
                        containLabel: true,
                    },
                    xAxis: {
                        axisLabel: {
                            show: true,
                            rotate: currentIsMobile ? 45 : 0,
                            fontSize: currentIsMobile ? 10 : 11
                        },
                        axisTick: { show: true },
                        axisLine: { show: true }
                    },
                    yAxis: [
                        {
                            axisLabel: { show: false },
                            axisTick: { show: false },
                            axisLine: { show: false }
                        },
                        {
                            axisLabel: { show: false },
                            axisTick: { show: false },
                            axisLine: { show: false }
                        }
                    ],
                    series: [
                        {
                            data: getSalesData(currentIsMobile),
                            label: getLabelConfig(currentIsMobile)
                        }
                    ]
                });
                timelineChart.resize();
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initTimelineChart);
        } else {
            initTimelineChart();
        }
    })();
</script>
