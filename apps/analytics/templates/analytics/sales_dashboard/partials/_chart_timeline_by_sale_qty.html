<div id="timelineChart" style="width: 100%; height: 380px; min-height: 380px;"></div>

<script>
    (function() {
        function initTimelineChart() {
            const chartDom = document.getElementById('timelineChart');
            if (!chartDom) return;

            // Dispose previous instance if reloaded via HTMX or navigation
            if (echarts.getInstanceByDom(chartDom)) {
                echarts.dispose(chartDom);
            }

            const rawData = {{ chart_data.timeline_data|safe|default:'{}' }};
            const timelineData = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;

            const titleColor = getComputedStyle(document.documentElement).getPropertyValue('--color-title').trim() || '#9ca3af';
            const isMobile = window.innerWidth < 768;
            const greenColor = '#43B54B';
            const blueColor = '#435AB5';
            const trendColor = '#f59e0b';
            const containerBg = (chartDom.parentElement && getComputedStyle(chartDom.parentElement).backgroundColor)
                || getComputedStyle(document.documentElement).getPropertyValue('--color-container').trim()
                || '#ffffff';

            function getSalesData(isMob = false) {
                const sales = timelineData.sales || [];
                const len = sales.length;
                const isDaily = Boolean(timelineData.is_daily);
                const growthList = timelineData.growth || [];

                return sales.map((val, idx) => {
                    const item = {
                        value: val,
                        label: {
                            show: Number(val) > 0
                        }
                    };

                    if (len > 1) {
                        if (idx === 0) {
                            item.label.offset = [isMob ? 22 : 16, 0];
                        } else if (idx === len - 1) {
                            item.label.offset = [isMob ? -22 : -16, 0];
                        }
                    }

                    if (!isDaily && growthList[idx] !== null && growthList[idx] !== undefined) {
                        const gVal = Number(growthList[idx]);
                        const isUp = gVal >= 0;
                        item.symbol = 'triangle';
                        item.symbolSize = isMob ? 12 : 15;
                        item.symbolRotate = isUp ? 0 : 180;
                        item.itemStyle = {
                            color: isUp ? '#10b981' : '#ef4444',
                            borderColor: containerBg,
                            borderWidth: 1.5
                        };
                    }

                    return item;
                });
            }

            function getTrendData() {
                const sales = timelineData.sales || [];
                const categories = timelineData.categories || [];
                const n = sales.length;
                if (n === 0) return [];
                if (n === 1) return [Math.round((Number(sales[0]) || 0) * 100) / 100];

                const now = new Date();
                const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                const todayMonthStr = todayStr.substring(0, 7);

                function isElapsed(cat) {
                    if (!cat) return false;
                    if (cat.length === 10) return cat <= todayStr;
                    if (cat.length === 7) return cat <= todayMonthStr;
                    return true;
                }

                let lastSalesIdx = -1;
                for (let i = n - 1; i >= 0; i--) {
                    if (Number(sales[i]) > 0) {
                        lastSalesIdx = i;
                        break;
                    }
                }

                // indx used for linear regression fitting
                const fitIndices = [];
                for (let i = 0; i < n; i++) {
                    const cat = categories[i];
                    if (isElapsed(cat) || (lastSalesIdx >= 0 && i <= lastSalesIdx)) {
                        fitIndices.push(i);
                    }
                }

                const indicesToUse = fitIndices.length > 0 ? fitIndices : Array.from({ length: n }, (_, i) => i);
                const mCount = indicesToUse.length;

                if (mCount === 1) {
                    const singleVal = Math.round((Number(sales[indicesToUse[0]]) || 0) * 100) / 100;
                    return sales.map(() => singleVal);
                }

                let sumX = 0;
                let sumY = 0;
                let sumXY = 0;
                let sumX2 = 0;

                for (let idx of indicesToUse) {
                    const x = idx;
                    const y = Number(sales[idx]) || 0;
                    sumX += x;
                    sumY += y;
                    sumXY += x * y;
                    sumX2 += x * x;
                }

                const denom = mCount * sumX2 - sumX * sumX;
                let slope = 0;
                let intercept = 0;

                if (denom !== 0) {
                    slope = (mCount * sumXY - sumX * sumY) / denom;
                    intercept = (sumY - slope * sumX) / mCount;
                } else {
                    slope = 0;
                    intercept = sumY / mCount;
                }

                return sales.map((_, i) => {
                    const val = slope * i + intercept;
                    return Math.round(Math.max(0, val) * 100) / 100;
                });
            }

            function getLabelConfig(isMob) {
                return {
                    show: true,
                    position: 'top',
                    distance: isMob ? 5 : 6,
                    color: greenColor,
                    fontSize: isMob ? 8.5 : 9.5,
                    fontWeight: '700',
                    backgroundColor: containerBg,
                    borderColor: titleColor,
                    borderWidth: 1,
                    borderRadius: 3,
                    padding: isMob ? [1.5, 4] : [2, 5],
                    formatter: function(params) {
                        return formatNumberShort(params.value, true);
                    }
                };
            }

            function formatNumberShort(val, isCurrency = false) {
                if (val === null || val === undefined || isNaN(val) || Number(val) <= 0) return '';
                const num = Number(val);
                const abs = Math.abs(num);
                const prefix = isCurrency ? '$ ' : '';

                let text = '';
                if (abs >= 1000000) {
                    const m = abs / 1000000;
                    text = parseFloat(m.toFixed(1)) + ' M';
                } else if (abs >= 1000) {
                    const k = abs / 1000;
                    if (k >= 999.95) {
                        text = '1 M';
                    } else {
                        text = parseFloat(k.toFixed(1)) + ' k';
                    }
                } else {
                    text = abs.toLocaleString('es-MX');
                }

                return `${prefix}${text}`;
            }

            const timelineChart = echarts.init(chartDom);

            const timelineOptions = {
                color: [greenColor, blueColor, trendColor],
                title: {
                    text: 'Evolución de venta neta y unidades',
                    textStyle: {
                        fontWeight: 'normal',
                        fontSize: 14,
                        color: titleColor
                    },
                    top: 8,
                },
                tooltip: {
                    trigger: 'axis',
                    formatter: function(params) {
                        if (!params || params.length === 0) return '';
                        const dataIndex = params[0].dataIndex;
                        const dateStr = params[0].axisValue || '';

                        let res = `<span style="font-weight:600;">${dateStr}</span><br/>`;
                        params.forEach(p => {
                            if (p.seriesName === 'Tendencia') return;
                            const isCurrency = p.seriesName === 'Venta neta';
                            const val = isCurrency
                                ? '$ ' + Number(p.value || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                                : Number(p.value || 0).toLocaleString('es-MX');
                            res += `${p.marker} ${p.seriesName}: <b>${val}</b><br/>`;
                        });

                        if (timelineData.target_achievement && timelineData.target_achievement[dataIndex] !== undefined) {
                            const ach = timelineData.target_achievement[dataIndex];
                            res += `<span style="display:inline-block;margin-right:4px;border-radius:10px;width:10px;height:10px;background-color:#8b5cf6;"></span> Alcance acum.: <b>${ach}%</b><br/>`;
                        }

                        const trendData = getTrendData();
                        const trendVal = trendData ? trendData[dataIndex] : null;
                        const isDaily = Boolean(timelineData.is_daily);
                        const growth = timelineData.growth ? timelineData.growth[dataIndex] : null;
                        const priorSale = timelineData.prior_sales ? timelineData.prior_sales[dataIndex] : null;

                        res += `<div style="border-top: 1px solid rgba(156,163,175,0.3); margin-top: 5px; padding-top: 4px;">`;

                        if (trendVal !== null && trendVal !== undefined) {
                            res += `<span style="display:inline-block;margin-right:4px;border-radius:2px;width:10px;height:3px;background-color:${trendColor};vertical-align:middle;"></span> Tendencia: <b>$ ${Number(trendVal).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</b><br/>`;
                        }

                        if (!isDaily) {
                            if (growth !== null && growth !== undefined) {
                                const isUp = Number(growth) >= 0;
                                const arrow = isUp ? '▲' : '▼';
                                const gColor = isUp ? '#10b981' : '#ef4444';
                                const sign = isUp ? '+' : '';
                                res += `<span style="color:${gColor};font-weight:700;margin-right:4px;">${arrow}</span> Crecimiento vs año pasado: <b style="color:${gColor};">${sign}${Number(growth).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%</b><br/>`;
                            }
                            if (priorSale !== null && priorSale !== undefined) {
                                res += `<span style="display:inline-block;margin-right:4px;border-radius:10px;width:8px;height:8px;border:1.5px solid ${titleColor};"></span> Venta ciclo pasado: <b>$ ${Number(priorSale).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</b><br/>`;
                            }
                        }

                        res += `</div>`;

                        return res;
                    }
                },
                legend: {
                    data: ['Venta neta', 'Unidades', 'Tendencia'],
                    bottom: 0,
                    left: 'center',
                    textStyle: {
                        color: titleColor
                    }
                },
                grid: {
                    left: isMobile ? '6%' : '3%',
                    right: isMobile ? '6%' : '3%',
                    top: isMobile ? 48 : 42,
                    bottom: isMobile ? '16%' : '12%',
                    containLabel: true,
                },
                toolbox: {
                    feature: {
                        saveAsImage: {}
                    }
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: timelineData.categories || [],
                    splitLine: {
                        show: false
                    },
                    axisLabel: {
                        show: true,
                        color: titleColor,
                        rotate: isMobile ? 45 : 0,
                        fontSize: isMobile ? 10 : 11
                    },
                    axisTick: {
                        show: true
                    },
                    axisLine: {
                        show: true
                    }
                },
                yAxis: [
                    {
                        type: 'value',
                        boundaryGap: [0, '18%'],
                        splitLine: {
                            lineStyle: {
                                opacity: 0.10,
                            },
                            show: true
                        },
                        axisLabel: {
                            show: false
                        },
                        axisTick: {
                            show: false
                        },
                        axisLine: {
                            show: false
                        },
                        show: true
                    },
                    {
                        type: 'value',
                        boundaryGap: [0, '18%'],
                        splitLine: {
                            lineStyle: {
                                opacity: 0.1,
                            },
                            show: false
                        },
                        axisLabel: {
                            show: false
                        },
                        axisTick: {
                            show: false
                        },
                        axisLine: {
                            show: false
                        },
                        show: true
                    }
                ],
                series: [
                    {
                        name: 'Venta neta',
                        type: 'line',
                        clip: false,
                        showSymbol: true,
                        showAllSymbol: true,
                        data: getSalesData(isMobile),
                        smooth: false,
                        yAxisIndex: 0,
                        label: getLabelConfig(isMobile),
                        labelLayout: {
                            hideOverlap: true
                        }
                    },
                    {
                        name: 'Unidades',
                        type: 'line',
                        clip: false,
                        data: timelineData.units || [],
                        smooth: false,
                        yAxisIndex: 1
                    },
                    {
                        name: 'Tendencia',
                        type: 'line',
                        clip: false,
                        data: getTrendData(),
                        smooth: false,
                        symbol: 'none',
                        yAxisIndex: 0,
                        lineStyle: {
                            type: 'dashed',
                            width: 2,
                            color: trendColor
                        },
                        itemStyle: {
                            color: trendColor
                        }
                    }
                ]
            };

            timelineChart.setOption(timelineOptions);
            window.addEventListener('resize', () => {
                const currentIsMobile = window.innerWidth < 768;
                timelineChart.setOption({
                    grid: {
                        left: currentIsMobile ? '6%' : '3%',
                        right: currentIsMobile ? '6%' : '3%',
                        top: currentIsMobile ? 48 : 42,
                        bottom: currentIsMobile ? '16%' : '12%',
                        containLabel: true,
                    },
                    xAxis: {
                        axisLabel: {
                            show: true,
                            rotate: currentIsMobile ? 45 : 0,
                            fontSize: currentIsMobile ? 10 : 11
                        },
                        axisTick: { show: true },
                        axisLine: { show: true }
                    },
                    yAxis: [
                        {
                            axisLabel: { show: false },
                            axisTick: { show: false },
                            axisLine: { show: false }
                        },
                        {
                            axisLabel: { show: false },
                            axisTick: { show: false },
                            axisLine: { show: false }
                        }
                    ],
                    series: [
                        {
                            name: 'Venta neta',
                            data: getSalesData(currentIsMobile),
                            label: getLabelConfig(currentIsMobile)
                        }
                    ]
                });
                timelineChart.resize();
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initTimelineChart);
        } else {
            initTimelineChart();
        }
    })();
</script>
