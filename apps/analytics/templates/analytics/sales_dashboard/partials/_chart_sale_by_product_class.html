<div id="productClassBarChart" class="w-full h-[380px] min-h-full border border-border rounded bg-container"></div>

<script>
    (function() {
        function initProductClassChart() {
            const chartDom = document.getElementById('productClassBarChart');
            if (!chartDom) return;

            if (echarts.getInstanceByDom(chartDom)) {
                echarts.dispose(chartDom);
            }

            const rawData = {{ chart_data.product_class_chart_data|safe|default:'{}' }};
            const productClassData = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;

            const titleColor = getComputedStyle(document.documentElement).getPropertyValue('--color-title').trim() || '#9ca3af';
            const isMobile = window.innerWidth < 768;
            const greenColor = '#43B54B';
            const blueColor = '#435AB5';

            const productClassBarChart = echarts.init(chartDom);

            const productClassOption = {
                color: [greenColor, blueColor],
                title: {
                    text: 'Venta neta por clase de producto',
                    textStyle: {
                        fontWeight: 'normal',
                        fontSize: 14,
                        color: titleColor
                    },
                    top: 8,
                },
                toolbox: {
                    feature: {
                        saveAsImage: {}
                    }
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    },
                    formatter: function(params) {
                        if (!params || params.length === 0) return '';
                        const dataIndex = params[0].dataIndex;
                        const classId = params[0].axisValue || '';
                        const className = (productClassData.names && productClassData.names[dataIndex]) || classId;

                        let res = `<span style="font-weight:600;">${className}</span><br/>`;
                        params.forEach(p => {
                            const val = '$ ' + Number(p.value || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                            res += `${p.marker} ${p.seriesName}: <b>${val}</b><br/>`;
                        });

                        if (productClassData.contributions && productClassData.contributions[dataIndex] !== undefined) {
                            const cont = productClassData.contributions[dataIndex];
                            res += `<span style="display:inline-block;margin-right:4px;border-radius:10px;width:10px;height:10px;background-color:#06b6d4;"></span> Contribución: <b>${cont}%</b><br/>`;
                        }

                        if (productClassData.target_achievement && productClassData.target_achievement[dataIndex] !== undefined) {
                            const target = (productClassData.targets && productClassData.targets[dataIndex]) || 0;
                            if (target > 0) {
                                const ach = productClassData.target_achievement[dataIndex];
                                res += `<span style="display:inline-block;margin-right:4px;border-radius:10px;width:10px;height:10px;background-color:#8b5cf6;"></span> Alcance: <b>${ach}%</b>`;
                            }
                        }

                        return res;
                    }
                },
                legend: {
                    data: ['Venta', 'Objetivo'],
                    bottom: 0,
                    left: 'center',
                    textStyle: {
                        color: titleColor
                    }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '12%',
                    containLabel: true,
                },
                xAxis: {
                    type: 'value',
                    boundaryGap: [0, 0.01],
                    splitLine: {
                        lineStyle: {
                            opacity: 0.10,
                        },
                        show: true
                    },
                    axisLabel: {
                        show: false
                    },
                    axisTick: {
                        show: false
                    },
                    axisLine: {
                        show: false
                    }
                },
                yAxis: {
                    type: 'category',
                    data: productClassData.categories || [],
                    axisLabel: {
                        color: titleColor,
                        formatter: function(val, index) {
                            const sale = (productClassData.sales && productClassData.sales[index] !== undefined)
                                ? '$ ' + Number(productClassData.sales[index]).toLocaleString('es-MX', { maximumFractionDigits: 0 })
                                : '';
                            return `${val}\n{sale|${sale}}`;
                        },
                        rich: {
                            sale: {
                                color: greenColor,
                                fontSize: 10,
                                lineHeight: 14,
                                fontWeight: '500'
                            }
                        }
                    }
                },
                series: [
                    {
                        name: 'Venta',
                        type: 'bar',
                        data: productClassData.sales || [],
                        barMaxWidth: 20,
                    },
                    {
                        name: 'Objetivo',
                        type: 'bar',
                        data: productClassData.targets || [],
                        barMaxWidth: 20,
                    }
                ]
            };

            productClassBarChart.setOption(productClassOption);
            window.addEventListener('resize', () => productClassBarChart.resize());
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initProductClassChart);
        } else {
            initProductClassChart();
        }
    })();
</script>
