<div class="border border-border rounded flex flex-col bg-container p-3 h-full min-h-[420px]">
    <div id="customerCategoryTimelineChart" style="width: 100%; height: 390px; min-height: 390px;"></div>
</div>

<script id="category-composition-data" type="application/json">
{{ chart_data.category_composition|safe }}
</script>

<script>
    (function () {
        function initCategoryCompositionChart() {
            const chartDom = document.getElementById("customerCategoryTimelineChart");
            if (!chartDom) return;

            if (echarts.getInstanceByDom(chartDom)) {
                echarts.dispose(chartDom);
            }

            const dataEl = document.getElementById("category-composition-data");
            const data = dataEl ? JSON.parse(dataEl.textContent || '{}') : {};

            if (!data || !data.months_labels || data.months_labels.length === 0) {
                return;
            }

            const titleColor = getComputedStyle(document.documentElement).getPropertyValue('--color-title').trim() || '#9ca3af';
            const isMobile = window.innerWidth < 768;

            const months = data.months_labels || [];
            const categories = data.categories || ['c', 'a', 'aa', 'oro', 'diamante'];
            const categoryDisplay = data.category_display || ['C', 'A', 'AA', 'Oro', 'Diamante'];
            const counts = data.category_counts || {};
            const pcts = data.category_pcts || {};
            const customerIds = data.category_customer_ids || {};
            const totalPortfolio = data.total_portfolio || [];

            const colorMap = {
                'c': '#94a3b8',
                'a': '#3b82f6',
                'aa': '#10b981',
                'oro': '#f59e0b',
                'diamante': '#06b6d4'
            };

            const seriesList = categories.map(function (catKey, idx) {
                const displayName = categoryDisplay[idx] || catKey.toUpperCase();
                const color = colorMap[catKey] || '#6366f1';
                const catPcts = pcts[catKey] || [];

                return {
                    name: displayName,
                    type: 'bar',
                    stack: 'total',
                    barWidth: '55%',
                    color: color,
                    itemStyle: {
                        opacity: 0.9
                    },
                    cursor: 'pointer',
                    label: {
                        show: true,
                        position: 'inside',
                        color: '#ffffff',
                        fontSize: 10,
                        formatter: function (params) {
                            const val = Number(params.value || 0);
                            return val >= 6 ? `${val.toFixed(0)}%` : '';
                        }
                    },
                    data: catPcts
                };
            });

            const chart = echarts.init(chartDom);
            const option = {
                title: {
                    text: 'Composición de la cartera por categoría',
                    top: 8,
                    left: 'center',
                    textStyle: {
                        fontWeight: 'normal',
                        fontSize: 14,
                        color: titleColor
                    },
                },
                legend: {
                    data: categoryDisplay,
                    bottom: 0,
                    left: 'center',
                    icon: 'circle',
                    itemWidth: 10,
                    itemHeight: 10,
                    textStyle: { color: titleColor, fontSize: 11 },
                    cursor: 'pointer'
                },
                toolbox: {
                    feature: {
                        saveAsImage: {
                            title: 'Guardar imagen',
                            name: 'composicion_cartera_categoria'
                        }
                    }
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' },
                    formatter: function (params) {
                        if (!params || params.length === 0) return '';
                        const monthIndex = params[0].dataIndex;
                        const monthName = months[monthIndex] || '';
                        const total = totalPortfolio[monthIndex] || 0;

                        let tooltipHtml = `<span>${monthName}</span><br/>`;
                        tooltipHtml += `<span style="font-size:11px;opacity:0.75;">Total cartera: ${total} clientes</span><br/>`;
                        tooltipHtml += `<div style="margin-top:4px;border-top:1px solid rgba(255,255,255,0.1);padding-top:4px;">`;

                        // Display in reverse order (Diamante down to C) in tooltip for intuitive readability
                        for (let i = params.length - 1; i >= 0; i--) {
                            const p = params[i];
                            const catKey = categories[p.seriesIndex];
                            const catCount = (counts[catKey] && counts[catKey][monthIndex]) ? counts[catKey][monthIndex] : 0;
                            const pctVal = Number(p.value || 0).toFixed(2);
                            tooltipHtml += `${p.marker} ${p.seriesName}: <span>${catCount}</span> (${pctVal}%)<br/>`;
                        }
                        tooltipHtml += `</div>`;
                        tooltipHtml += `<span style="font-size:11px;opacity:0.75;display:inline-block;margin-top:4px;">Clic en una barra para ver clientes</span>`;
                        return tooltipHtml;
                    }
                },
                grid: {
                    left: isMobile ? '8%' : '4%',
                    right: isMobile ? '8%' : '4%',
                    bottom: isMobile ? '20%' : '14%',
                    top: 55,
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: months,
                    axisLabel: {
                        color: titleColor,
                        interval: 0,
                        rotate: isMobile ? 45 : (months.length > 10 ? 30 : 0),
                        fontSize: 10
                    },
                    splitLine: { show: false }
                },
                yAxis: {
                    type: 'value',
                    min: 0,
                    max: 100,
                    axisLabel: {
                        color: titleColor,
                        formatter: '{value}%'
                    },
                    splitLine: {
                        lineStyle: { type: 'dashed', opacity: 0.12 }
                    }
                },
                series: seriesList
            };

            chart.setOption(option);

            chart.on('click', function (params) {
                if (params.componentType === 'series') {
                    const seriesIndex = params.seriesIndex;
                    const dataIndex = params.dataIndex;
                    const catKey = categories[seriesIndex];
                    const cids = (customerIds[catKey] && customerIds[catKey][dataIndex]) ? customerIds[catKey][dataIndex] : [];

                    if (cids && cids.length > 0) {
                        const baseUrl = "{% url 'analytics:customer_kpis_view' %}";
                        const targetUrl = `${baseUrl}?customer=${encodeURIComponent(cids.join(','))}`;
                        window.location.href = targetUrl;
                    }
                }
            });

            window.addEventListener('resize', function () { chart.resize(); });
        }

        document.addEventListener('DOMContentLoaded', initCategoryCompositionChart);
        document.addEventListener('htmx:afterSwap', initCategoryCompositionChart);
        initCategoryCompositionChart();
    })();
</script>
