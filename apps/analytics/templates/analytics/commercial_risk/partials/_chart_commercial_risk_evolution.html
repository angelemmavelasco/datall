<div id="commercialRiskEvolutionChart" style="width: 100%; height: 380px; min-height: 380px;"></div>

<script>
    (function() {
        function initCommercialRiskEvolutionChart() {
            const chartDom = document.getElementById('commercialRiskEvolutionChart');
            if (!chartDom) return;

            if (echarts.getInstanceByDom(chartDom)) {
                echarts.dispose(chartDom);
            }

            const rawData = {{ chart_data.timeline_chart|safe|default:'{}' }};
            const chartData = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;

            const titleColor = getComputedStyle(document.documentElement).getPropertyValue('--color-title').trim() || '#9ca3af';
            const isMobile = window.innerWidth < 768;

            const ircColor = '#8b5cf6';          // Violeta / IRC
            const giniColor = '#f43f5e';         // Coral / Gini
            const unattendedColor = '#64748b';   // Slate / Desatendidos

            const evolutionChart = echarts.init(chartDom);

            const options = {
                color: [ircColor, giniColor, unattendedColor],
                title: {
                    text: 'Evolución del riesgo comercial (Trimestres móviles)',
                    textStyle: {
                        fontWeight: 'normal',
                        fontSize: 14,
                        color: titleColor
                    },
                    top: 8,
                },
                tooltip: {
                    trigger: 'axis',
                    formatter: function(params) {
                        if (!params || params.length === 0) return '';
                        const dataIndex = params[0].dataIndex;
                        const dateLabel = chartData.months_labels && chartData.months_labels[dataIndex] ? chartData.months_labels[dataIndex] : params[0].axisValue;

                        let res = `<span style="font-weight:600;font-size:12px;">${dateLabel}</span><br/>`;
                        res += `<span style="font-size:11px;color:#94a3b8;font-style:italic;">Evaluación trimestre móvil previo</span><br/>`;
                        
                        params.forEach(p => {
                            const val = Number(p.value || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' %';
                            res += `${p.marker} ${p.seriesName}: <b>${val}</b><br/>`;
                        });

                        if (chartData.portfolio_scope && chartData.portfolio_scope[dataIndex] !== undefined) {
                            const scope = Number(chartData.portfolio_scope[dataIndex]).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                            res += `<span style="display:inline-block;margin-right:4px;border-radius:10px;width:10px;height:10px;background-color:#3b82f6;"></span> Alcance de cartera: <b>${scope} %</b><br/>`;
                        }

                        return res;
                    }
                },
                legend: {
                    data: ['Índice de riesgo comercial', 'Índice de Gini (concentración)', 'Clientes desatendidos'],
                    bottom: 0,
                    left: 'center',
                    textStyle: {
                        color: titleColor,
                        fontSize: isMobile ? 10 : 12
                    }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: isMobile ? '18%' : '12%',
                    top: 50,
                    containLabel: true,
                },
                toolbox: {
                    feature: {
                        saveAsImage: {
                            title: 'Guardar imagen',
                            name: 'evolucion_riesgo_comercial'
                        }
                    }
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: chartData.months_labels || chartData.timeline_months || [],
                    splitLine: {
                        show: false
                    },
                    axisLabel: {
                        color: titleColor,
                        rotate: isMobile ? 45 : 0,
                        fontSize: isMobile ? 10 : 11
                    },
                    axisTick: {
                        show: !isMobile
                    }
                },
                yAxis: {
                    type: 'value',
                    name: 'Porcentaje (%)',
                    nameTextStyle: {
                        color: titleColor,
                        fontSize: 11
                    },
                    min: 0,
                    max: 100,
                    axisLabel: {
                        formatter: '{value}%',
                        color: titleColor
                    },
                    splitLine: {
                        lineStyle: {
                            opacity: 0.15,
                            type: 'dashed'
                        },
                        show: true
                    }
                },
                series: [
                    {
                        name: 'Índice de riesgo comercial',
                        type: 'line',
                        data: chartData.commercial_risk_index || [],
                        symbol: 'circle',
                        symbolSize: 8,
                        lineStyle: {
                            width: 3,
                            color: ircColor
                        },
                        itemStyle: {
                            color: ircColor
                        }
                    },
                    {
                        name: 'Índice de Gini (concentración)',
                        type: 'line',
                        data: chartData.gini || [],
                        symbol: 'rect',
                        symbolSize: 7,
                        lineStyle: {
                            type: 'dashed',
                            width: 2,
                            color: giniColor
                        },
                        itemStyle: {
                            color: giniColor
                        }
                    },
                    {
                        name: 'Clientes desatendidos',
                        type: 'line',
                        data: chartData.portfolio_scope_complement || [],
                        symbol: 'triangle',
                        symbolSize: 7,
                        lineStyle: {
                            type: 'dashed',
                            width: 2,
                            color: unattendedColor
                        },
                        itemStyle: {
                            color: unattendedColor
                        }
                    }
                ]
            };

            evolutionChart.setOption(options);

            window.addEventListener('resize', () => {
                evolutionChart.resize();
            });
        }

        document.addEventListener('DOMContentLoaded', initCommercialRiskEvolutionChart);
        document.addEventListener('htmx:afterSwap', initCommercialRiskEvolutionChart);
    })();
</script>
