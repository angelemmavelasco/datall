<div class="border border-border rounded flex flex-col bg-container p-2 h-full min-h-[380px]">
    <div id="clientCategoryChart" style="width: 100%; height: 360px; min-height: 360px;"></div>
</div>

<script>
    (function() {
        function initClientCategoryChart() {
            const chartDom = document.getElementById('clientCategoryChart');
            if (!chartDom) return;

            if (echarts.getInstanceByDom(chartDom)) {
                echarts.dispose(chartDom);
            }

            const rawData = {{ chart_data.sale_by_customer_category|safe|default:'[]' }};
            const categoryData = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;

            if (!categoryData || categoryData.length === 0) {
                return;
            }

            const titleColor = getComputedStyle(document.documentElement).getPropertyValue('--color-title').trim() || '#9ca3af';

            const clientCategoryChart = echarts.init(chartDom);

            const clientCategoryOption = {
                color: ['#43B54B', '#435AB5', '#8b5cf6', '#f59e0b', '#06b6d4', '#ec4899', '#14b8a6', '#f97316'],
                title: {
                    text: 'Ventas por tipo de cliente',
                    textStyle: {
                        fontWeight: 'normal',
                        fontSize: 14,
                        color: titleColor
                    },
                    top: 8,
                    left: 'center',
                },
                toolbox: {
                    feature: {
                        saveAsImage: {}
                    }
                },
                tooltip: {
                    trigger: 'item',
                    formatter: function(params) {
                        if (!params || !params.data) return '';
                        const item = params.data;
                        const val = '$ ' + Number(item.value || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                        const custCount = Number(item.customer_count || 0).toLocaleString();
                        return `<span style="font-weight:600;">${item.name}</span><br/>` +
                               `${params.marker} Venta: <b>${val}</b> (${params.percent}%)<br/>` +
                               `Clientes: <b>${custCount}</b><br/>` +
                               `<span style="font-size:11px;opacity:0.75;display:inline-block;margin-top:4px;">Clic para ver clientes en el KPI</span>`;
                    }
                },
                legend: {
                    bottom: 0,
                    left: 'center',
                    textStyle: {
                        color: titleColor
                    }
                },
                series: [
                    {
                        name: 'Tipo de cliente',
                        type: 'pie',
                        radius: ['40%', '65%'],
                        center: ['50%', '48%'],
                        avoidLabelOverlap: false,
                        padAngle: 4,
                        itemStyle: {
                            borderRadius: 6
                        },
                        label: {
                            show: false,
                            position: 'center'
                        },
                        emphasis: {
                            label: {
                                show: true,
                                fontSize: 14,
                                fontWeight: 'bold',
                                color: titleColor,
                                formatter: '{b}\n{d}%'
                            }
                        },
                        data: categoryData || []
                    }
                ]
            };

            clientCategoryChart.setOption(clientCategoryOption);

            // Click event to navigate to Customer KPIs with customer IDs filtered
            clientCategoryChart.on('click', function(params) {
                if (!params || !params.data) return;
                const customerIds = params.data.customer_ids || [];

                if (customerIds && customerIds.length > 0) {
                    const baseUrl = "{% url 'analytics:customer_kpis_view' %}";
                    const targetUrl = `${baseUrl}?customer=${encodeURIComponent(customerIds.join(','))}`;
                    window.location.href = targetUrl;
                }
            });

            window.addEventListener('resize', () => clientCategoryChart.resize());
        }

        document.addEventListener('DOMContentLoaded', initClientCategoryChart);
        document.addEventListener('htmx:afterSwap', initClientCategoryChart);
        initClientCategoryChart();
    })();
</script>
