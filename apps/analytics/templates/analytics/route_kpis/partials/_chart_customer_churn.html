<div class="border border-border rounded flex flex-col bg-container p-2 h-full min-h-[380px]">
    <div id="lostAndWonBarChart" style="width: 100%; height: 360px; min-height: 360px;"></div>
</div>

<script>
    (function() {
        function initLostAndWonChart() {
            const chartDom = document.getElementById("lostAndWonBarChart");
            if (!chartDom) return;

            if (echarts.getInstanceByDom(chartDom)) {
                echarts.dispose(chartDom);
            }

            const rawData = {{ chart_data.customer_churn|safe|default:'{}' }};
            const data = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;

            if (!data || !data.months || data.months.length === 0) {
                return;
            }

            const titleColor = getComputedStyle(document.documentElement).getPropertyValue('--color-title').trim() || '#9ca3af';
            const isMobile = window.innerWidth < 768;

            const lostAndWonBarChart = echarts.init(chartDom);
            const lostAndWonBarChartOption = {
                title: {
                    text: 'Clientes ganados y perdidos (Mensual)',
                    top: 8,
                    left: 'center',
                    textStyle: {
                        fontWeight: 'normal',
                        fontSize: 14,
                        color: titleColor
                    },
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross',
                        crossStyle: { color: '#999' }
                    },
                    formatter: function(params) {
                        if (!params || params.length === 0) return '';
                        const month = params[0].axisValue || '';
                        let res = `<span style="font-weight:600;">${month}</span><br/>`;
                        params.forEach(p => {
                            res += `${p.marker} ${p.seriesName}: <b>${Number(p.value || 0).toLocaleString()}</b><br/>`;
                        });
                        res += `<span style="font-size:11px;opacity:0.75;display:inline-block;margin-top:4px;">Clic para ver clientes en el KPI</span>`;
                        return res;
                    }
                },
                legend: {
                    data: ['Clientes Ganados', 'Clientes Perdidos'],
                    bottom: 0,
                    left: 'center',
                    textStyle: { color: titleColor }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '12%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: data.months || [],
                    axisLabel: { color: titleColor },
                    splitLine: { lineStyle: { opacity: 0.1 } }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: { color: titleColor },
                    splitLine: { lineStyle: { opacity: 0.1 } }
                },
                series: [
                    {
                        name: 'Clientes Ganados',
                        type: 'line',
                        data: data.won || [],
                        itemStyle: { color: '#34d399' },
                        areaStyle: { opacity: 0.15 },
                        symbolSize: 8,
                        lineStyle: { width: 2.5 },
                        cursor: 'pointer'
                    },
                    {
                        name: 'Clientes Perdidos',
                        type: 'line',
                        data: data.lost || [],
                        itemStyle: { color: '#ef4444' },
                        areaStyle: { opacity: 0.15 },
                        symbolSize: 8,
                        lineStyle: { width: 2.5 },
                        cursor: 'pointer'
                    },
                ]
            };

            lostAndWonBarChart.setOption(lostAndWonBarChartOption);

            lostAndWonBarChart.on('click', function(params) {
                if (!params) return;
                const dataIndex = params.dataIndex;
                let customerIds = [];

                if (params.seriesName === 'Clientes Ganados') {
                    customerIds = (data.won_customer_ids && data.won_customer_ids[dataIndex]) ? data.won_customer_ids[dataIndex] : [];
                } else if (params.seriesName === 'Clientes Perdidos') {
                    customerIds = (data.lost_customer_ids && data.lost_customer_ids[dataIndex]) ? data.lost_customer_ids[dataIndex] : [];
                }

                if (customerIds && customerIds.length > 0) {
                    const baseUrl = "{% url 'analytics:customer_kpis_view' %}";
                    const targetUrl = `${baseUrl}?customer=${encodeURIComponent(customerIds.join(','))}`;
                    window.location.href = targetUrl;
                }
            });

            window.addEventListener('resize', function () { lostAndWonBarChart.resize(); });
        }

        document.addEventListener('DOMContentLoaded', initLostAndWonChart);
        document.addEventListener('htmx:afterSwap', initLostAndWonChart);
        initLostAndWonChart();
    })();
</script>
