<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-dana">
    <style>
        .dana-face {
            animation: float 4s ease-in-out infinite;
        }
        .dana-eye {
            transform-origin: center;
            transform-box: fill-box;
            animation: blink 5s infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-1.5px); }
        }
        
        @keyframes blink {
            0%, 92%, 100% { transform: scaleY(1); }
            96% { transform: scaleY(0.1); }
        }
    </style>
    
    <g class="dana-face">
        <!-- Contorno de la cara -->
        <path d="M7 2h10q5 0 5 8q0 10-3 10q-2 0-3-2H8q-1 2-3 2q-3 0-3-10q0-8 5-8z" />
        
        <!-- Ojos con clase animada -->
        <line class="dana-eye" x1="8" y1="7" x2="8" y2="13" />
        <line class="dana-eye" x1="16" y1="7" x2="16" y2="13" />
        
        <!-- Nariz -->
        <path d="M10.5 15l1.5 1.5l1.5-1.5" />
    </g>
</svg>
