<li id="reports-nav-item"
    onclick="toggleReports();"
    {% if has_pending_reports %}
    hx-get="{% url 'core:reports_indicator_view' %}"
    hx-trigger="every 3s"
    hx-swap="outerHTML"
    {% endif %}
    class="hover:text-hover cursor-pointer transition-colors flex flex-col md:flex-row items-center gap-1"
    title="Mis Archivos">

    <div class="relative flex items-center justify-center">
        {% if has_unseen_reports and not has_pending_reports %}
            <!-- Icono con alerta / completado sin ver (punto rojo animado pulsante) -->
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder" style="overflow: visible;">
                <style>
                    @keyframes pulse-ring {
                        0% { transform: scale(1); opacity: 0.9; }
                        100% { transform: scale(2.2); opacity: 0; }
                    }
                    @keyframes pulse-dot {
                        0%, 100% { transform: scale(1); }
                        50% { transform: scale(1.15); }
                    }
                    .ping-ring {
                        transform-origin: 20px 4px;
                        animation: pulse-ring 1.8s cubic-bezier(0.24, 0, 0.38, 1) infinite;
                    }
                    .ping-core {
                        transform-origin: 20px 4px;
                        animation: pulse-dot 1.8s ease-in-out infinite;
                    }
                </style>
                <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>

                <g>
                    <circle class="ping-ring" cx="20" cy="4" r="3" fill="#ef4444" stroke="none" />
                    <circle class="ping-core" cx="20" cy="4" r="3.5" fill="#ef4444" stroke="none" />
                </g>
            </svg>
        {% elif has_pending_reports %}
            <!-- Carpeta con indicador de proceso en segundo plano -->
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder" style="overflow: visible;">
                <style>
                    @keyframes pulse-amber {
                        0%, 100% { transform: scale(1); opacity: 0.8; }
                        50% { transform: scale(1.3); opacity: 1; }
                    }
                    .ping-amber {
                        transform-origin: 20px 4px;
                        animation: pulse-amber 1.2s ease-in-out infinite;
                    }
                </style>
                <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
                <circle class="ping-amber" cx="20" cy="4" r="3" fill="#f59e0b" stroke="none" />
            </svg>
        {% else %}
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder-icon lucide-folder"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
        {% endif %}
    </div>
    <span class="text-[10px] md:text-xs">Mis archivos</span>
</li>
