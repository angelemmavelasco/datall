<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <title>Recuperar Acceso | Datall</title>
    <link rel="icon" type="image/png" href="https://media.datall.com.mx/static/favicon.ico">

    <script>
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        const getThemeColor = (variableName, fallbackColor) => {
            const color = getComputedStyle(document.documentElement).getPropertyValue(variableName).trim();
            return color || fallbackColor;
        };
    </script>

    <style type="text/tailwindcss">
        @theme {
            --color-page: var(--bg-page);
            --color-body: var(--text-body);
            --color-container: var(--bg-container);
            --color-title: var(--text-title);
            --color-strong: var(--text-strong);
            --color-muted: var(--text-muted);
            --color-border: var(--border);
            --color-placeholder: var(--placeholder);
            --color-hover: var(--hover);

            --color-msg-error-bg: oklch(80.8% 0.114 19.571);
            --color-msg-error-txt: oklch(25.8% 0.092 26.042);
            --color-msg-error-border: oklch(50.5% 0.213 27.518);
        }

        :root {
            --bg-page: oklch(98.4% 0.003 247.858);
            --bg-container: oklch(94.6% 0.01 255);
            --text-title: oklch(44.6% 0.03 256.802);
            --text-body: oklch(12.9% 0.042 264.695);
            --text-strong: oklch(37.2% 0.044 257.287);
            --border: oklch(86.9% 0.022 252.894);
            --placeholder: oklch(55.4% 0.046 257.417);
            --hover: oklch(70.7% 0.022 261.325);
        }

        :root.dark {
            --bg-page: oklch(13% 0.028 261.692);
            --bg-container: oklch(18% 0.033 260);
            --text-title: oklch(70.7% 0.022 261.325);
            --text-body: oklch(98.4% 0.003 247.858);
            --text-strong: oklch(78% 0.035 256.788);
            --border: oklch(27.9% 0.041 260.031);
            --placeholder: oklch(55.4% 0.046 257.417);
            --hover: oklch(44.6% 0.03 256.802);
        }

        html,
        body {
            min-height: 100dvh;
            background-color: var(--color-page);
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--border) var(--bg-page);
        }
    </style>
</head>

<body class="relative min-h-screen flex items-center justify-center overflow-hidden bg-page">

    <div class="relative z-10 w-3/4 max-w-md p-2 bg-container rounded border border-border flex flex-col gap-4 justify-center items-center" id="reset-container">

        <h1 class="text-3xl flex items-center justify-center gap-0 transition-colors max-h-20 mt-20 mb-10">
            <span class="text-body tracking-widest hover:text-hover transition-colors">dat</span>
            <span class="text-strong tracking-widest hover:text-hover transition-colors">all</span>
            <img src="https://media.datall.com.mx/static/logo.svg" alt="" class="h-10 w-10 object-contain p-1 bg-[#f1f1f1] rounded-sm border border-border">
        </h1>

        <p class="text-title text-sm mb-4 w-3/4 text-center">
            Ingresa tu correo para recibir un enlace de recuperación.
        </p>

        <form class="flex flex-col gap-4 w-3/4 items-center justify-center" method="POST" id="reset-form">
            {% csrf_token %}

            {% if form.email.errors %}
            <div class="bg-msg-error-bg text-msg-error-txt text-sm p-3 rounded border border-msg-error-border w-full text-center">
                {{ form.email.errors.0 }}
            </div>
            {% endif %}

            <div class="flex items-center gap-2 text-body w-full">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mail-icon lucide-mail text-muted">
                    <rect width="20" height="16" x="2" y="4" rx="2"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
                <input id="{{ form.email.id_for_label }}" name="{{ form.email.name }}" type="email" required placeholder="Correo electrónico"
                    class="w-full border-b border-border bg-transparent focus:outline-none transition-all text-body placeholder-placeholder pb-1">
            </div>
        </form>

        <div class="flex flex-col gap-4 mt-10 w-3/4">

            <button type="submit" form="reset-form"
                class="cursor-pointer w-full text-body hover:text-hover flex items-center gap-2 justify-center transition-colors duration-300 border border-border rounded p-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-forward-icon lucide-forward">
                    <path d="m15 17 5-5-5-5"/>
                    <path d="M4 18v-2a4 4 0 0 1 4-4h12"/>
                </svg>
                <span>Enviar enlace</span>
            </button>

            <a href="{% url 'core:login' %}"
                class="cursor-pointer w-full text-body hover:text-hover flex items-center bg-page gap-2 justify-center transition-colors duration-300 border border-border rounded p-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left-icon lucide-chevron-left">
                    <path d="m15 18-6-6 6-6"/>
                </svg>
                <span>Iniciar sesión</span>
            </a>
        </div>

        <footer class="bottom-0 mt-10 mb-10 left-0 text-[10px] w-full z-40 flex items-center justify-center p-2 text-title">
            <ul class="flex gap-2 md:gap-4 flex-col md:flex-row">
                <li class="hover:text-hover transition-colors cursor-pointer flex items-center gap-1 justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copyright-icon lucide-copyright">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M14.83 14.83a4 4 0 1 1 0-5.66"/>
                    </svg>
                    Datall 2026. Todos los derechos reservados.
                </li>
            </ul>
        </footer>
    </div>

</body>
</html>
