{% extends 'base.html' %}

{% block module_name %}Contraseña Actualizada{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="w-full max-w-md p-6 bg-container rounded border border-border flex flex-col gap-4 justify-center items-center">

        <div class="bg-msg-succ-bg text-msg-succ-txt p-4 rounded-full border border-msg-succ-border mt-2 mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check-circle-2">
                <circle cx="12" cy="12" r="10"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
        </div>

        <h2 class="text-xl text-strong text-center mb-2">¡Listo!</h2>
        
        <div class="w-5/6 text-center space-y-4 text-sm text-body">
            <p>
                Tu contraseña ha sido cambiada correctamente.
            </p>
            <p class="text-muted text-[12px] border-t border-border pt-4">
                Puedes continuar usando la plataforma con tu nueva contraseña.
            </p>
        </div>
    </div>
</div>
{% endblock %}
