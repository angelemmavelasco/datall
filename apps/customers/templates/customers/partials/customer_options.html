{% for customer in customers %}
    <div onclick="selectDropdownOption('{{ field_name }}', '{{ customer.id }}', '{{ customer.name|title|escapejs }} ({{ customer.id }})', this)"
         class="option-item flex items-center justify-between p-1.5 rounded cursor-pointer hover:bg-hover transition-colors text-xs text-title {% if customer.id|stringformat:'s' == selected_id|stringformat:'s' %}bg-muted/10 font-medium{% endif %}">
        <span class="truncate" title="{{ customer.name|title }} ({{ customer.id }})">
            {{ customer.name|title }} <span class="text-secondary font-mono text-[11px]">({{ customer.id }})</span>
            {% if customer.current_route_id %}
                <span class="text-secondary text-[10px] ml-1">· R{{ customer.current_route_id }}</span>
            {% endif %}
        </span>
        {% if customer.id|stringformat:"s" == selected_id|stringformat:"s" %}
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-500 shrink-0 ml-1"><polyline points="20 6 9 17 4 12"/></svg>
        {% endif %}
    </div>
{% empty %}
    <div class="text-center py-3 text-secondary italic text-xs">No se encontraron clientes</div>
{% endfor %}
