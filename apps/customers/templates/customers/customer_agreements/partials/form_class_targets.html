<tr class="border-b border-border" id="class-target-row-{{ index }}">
    <td class="py-2 pr-2">
        <select name="product_classes[]" class="w-full bg-page border border-border rounded px-2 py-1 text-body focus:outline-none" required>
            <option value="">Seleccione...</option>
            {% for pc in product_classes %}
            <option value="{{ pc.id }}">{{ pc.name|title }}</option>
            {% endfor %}
        </select>
    </td>
    <td class="py-2 px-2">
        <input type="number" step="0.01" name="required_targets[]" class="w-full bg-page border border-border rounded px-2 py-1 text-body focus:outline-none" required>
    </td>
    <td class="py-2 px-2 text-center">
        <label class="flex items-center justify-center gap-2 cursor-pointer text-body">
            <input type="checkbox" name="is_mandatory_{{ index }}" class="accent-strong" checked>
        </label>
    </td>
    <td class="py-2 pl-2">
        <button type="button" 
                onclick="document.getElementById('class-target-row-{{ index }}').remove()"
                class="text-red-600 hover:text-red-800 transition-colors p-1 rounded">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
        </button>
    </td>
</tr>
